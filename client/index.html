<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>E-Shop — BHABY GROUP LTD Marketplace</title>
    <meta name="description" content="Multi-vendor marketplace and seller management platform by BHABY GROUP LTD. Buy, sell, and manage your business in one place." />
    <meta name="author" content="BHABY GROUP LTD" />
    <meta name="theme-color" content="#2563eb" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-Shop" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="E-Shop — BHABY GROUP LTD Marketplace" />
    <meta property="og:description" content="Shop from hundreds of local sellers or open your own store." />
    <meta property="og:site_name" content="E-Shop by BHABY GROUP LTD" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <script src="https://s3.us-east-1.amazonaws.com/assets.pythagora.ai/scripts/utils.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register service worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
