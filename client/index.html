<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>E-Shop — BHABY GROUP LTD Marketplace</title>
    <meta name="description" content="Multi-vendor marketplace and seller management platform by BHABY GROUP LTD. Buy, sell, and manage your business in one place." />
    <meta name="author" content="BHABY GROUP LTD" />
    <meta name="theme-color" content="#2563eb" />

    <!-- PWA manifest — generated by vite-plugin-pwa at build time -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="E-Shop" />

    <!-- Apple touch icons — must be PNG, not ICO -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="E-Shop — BHABY GROUP LTD Marketplace" />
    <meta property="og:description" content="Shop from hundreds of local sellers or open your own store." />
    <meta property="og:site_name" content="E-Shop by BHABY GROUP LTD" />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
